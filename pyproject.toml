[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yats"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.12,<2.0",
    "dagster-graphql>=1.12,<2.0",
    "psycopg2-binary",
    "questdb",
    "alpaca-py",
    "requests",
    "thetadata>=1.0.9",
    "grpcio>=1.80",
    "numpy>=2.4,<3.0",
    "pandas>=3.0,<4.0",
    "scipy",
    "statsmodels",
    "pyyaml",
    "websockets>=16.0",
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.20,<1.0",
    "httpx>=0.24,<1.0",
    "lightgbm>=4.0,<5.0",
    "scikit-learn>=1.4,<2.0",
    "pyarrow>=16.0",
]

# RL stack is optional: the demo and the supervised (ridge/lgbm) research path
# never import it. On Linux the default torch wheel pulls CUDA + cuDNN + NCCL
# (~7.7 GB); keep that out of the base install. `uv sync --extra rl` to get it.
[project.optional-dependencies]
rl = [
    "gymnasium>=1.2,<2.0",
    "torch>=2.10,<3.0",
    "stable-baselines3>=2.7,<3.0",
]

[tool.setuptools.packages.find]
include = ["pipelines*", "research*", "compute*", "dashboard*"]

[tool.pytest.ini_options]
markers = [
    "live_db: requires a live QuestDB instance on localhost:8812",
]

# Pin torch to the CPU-only wheel index so even `--extra rl` stays small on
# Linux (CPU wheels, no CUDA/cuDNN/NCCL). GPU users can override locally.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
