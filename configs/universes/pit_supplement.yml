# Curated supplement to the point-in-time candidate pool.
#
# WHY: the vendor's asset directory (active + inactive) is not a complete
# delisted-securities master — its inactive list covers older delistings
# (2020-21 M&A names appear) but misses most 2022+ departures. Without a
# supplement, recent delistings (incl. the 2023 bank failures) would be
# silently absent, re-introducing survivorship bias in its most
# results-flattering form.
#
# METHOD: hand-curated list of major liquid US delistings / symbol
# retirements 2022-2026 (M&A closings, bank failures, take-privates,
# pre-rename symbols). Every symbol verified to return daily bars from the
# data API (29/30 candidates verified 2026-09-11; WORK had none and was
# dropped). HONEST LIMIT: curated means non-exhaustive — smaller or
# overlooked delistings may still be missing; the residual bias is reduced,
# not eliminated. A licensed point-in-time constituency source remains the
# upgrade path.
